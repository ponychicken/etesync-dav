[project]
name = "etesync-dav"
version = "0.35.0"
description = "A CalDAV and CardDAV frontend for EteSync"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    {name = "Tom Hacohen", email = "tom@stosb.com"}
]
keywords = ["etesync", "encryption", "sync", "pim", "caldav", "carddav"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email :: Address Book",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "appdirs==1.4.4",
    "asn1crypto==1.4.0",
    "blinker==1.9.0",
    "certifi==2024.7.4",
    "cffi==1.17.1",
    "charset-normalizer==2.0.9",
    "click==8.1.7",
    "cryptography==42.0.4",
    "defusedxml==0.7.1",
    "etebase @ git+https://github.com/etesync/etebase-py.git",
    "etesync==0.12.1",
    "flask==3.1.0",
    "flask-wtf==1.2.2",
    "furl==2.1.3",
    "idna==3.7",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "markupsafe==2.1.1",
    "msgpack==1.0.3",
    "orderedmultidict==1.0.1",
    "packaging==24.2",
    "passlib==1.7.4",
    "peewee==3.14.8",
    "pika==1.3.2",
    "py==1.11.0",
    "pyasn1==0.4.8",
    "pycparser==2.21",
    "pyparsing==3.0.6",
    "pyobjc-framework-Cocoa>=7.0.0; sys_platform == 'darwin'",
    "pyobjc-framework-ServiceManagement>=7.0.0; sys_platform == 'darwin'",
    "pysocks==1.7.1",
    "pyscrypt>=1.2.6; sys_platform == 'darwin'",
    "python-dateutil==2.8.2",
    "pytz==2021.3",
    "radicale==3.2.3",
    "requests[socks]==2.26.0",
    "six==1.16.0",
    "urllib3==1.26.19",
    "vobject==0.9.6.1",
    "werkzeug==3.1.3",
    "wtforms==3.0.1"
]

[dependency-groups]
dev = [
    "build==1.2.1",
    "click==8.1.7",
    "packaging==24.2",
    "pip-tools==7.4.1",
    "pyinstaller>=6.14.1",
    "pyproject-hooks==1.1.0",
    "ruff==0.6.3",
    "wheel==0.44.0",
]


[project.urls]
Homepage = "https://github.com/etesync/etesync-dav"
Documentation = "https://github.com/etesync/etesync-dav/wiki"
Source = "https://github.com/etesync/etesync-dav"
Tracker = "https://github.com/etesync/etesync-dav/issues"

[tool.uv]
package = true

[tool.black]
line-length = 120

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "migrations", # Alembic migrations
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "T20", "W"]
ignore = ["E203", "E501", "E711", "E712", "E721", "N802", "N803", "N806", "N812", "N815", "N818", "T201"]

[tool.ruff.lint.isort]
combine-as-imports = true
